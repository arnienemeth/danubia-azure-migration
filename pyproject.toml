[project]
name = "danubia"
version = "0.1.0"
description = "Danubia Components: simulated 250-employee company migrating to Microsoft Azure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=30",
    "polars>=1.0",
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "fpdf2>=2.8",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "rich>=13",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danubia"]

[tool.ruff]
line-length = 110
